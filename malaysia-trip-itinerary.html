<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Malaysia, 22&ndash;29 Sep 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#132420; --ink-soft:#4d5f5a;
  --paper:#f3f6f1; --raised:#ffffff;
  --canopy:#1f5c4f; --canopy-deep:#123b33;
  --saffron:#c47f16; --saffron-soft:#f3e6cd;
  --andaman:#2f6c86; --andaman-soft:#e2eef1;
  --brick:#9c4231; --brick-soft:#f5e6e2;
  --line:#d7ddd1; --shadow:rgba(18,40,34,0.12);
  --focus:#1f5c4f;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e7ede9; --ink-soft:#a9b6ae;
    --paper:#101613; --raised:#1a211d;
    --canopy:#5fb39f; --canopy-deep:#3e8c7a;
    --saffron:#e0a94a; --saffron-soft:#332711;
    --andaman:#7cb7cc; --andaman-soft:#132a30;
    --brick:#e0897a; --brick-soft:#33201c;
    --line:#2b332d; --shadow:rgba(0,0,0,0.4);
    --focus:#5fb39f;
  }
}
:root[data-theme="dark"]{
  --ink:#e7ede9; --ink-soft:#a9b6ae;
  --paper:#101613; --raised:#1a211d;
  --canopy:#5fb39f; --canopy-deep:#3e8c7a;
  --saffron:#e0a94a; --saffron-soft:#332711;
  --andaman:#7cb7cc; --andaman-soft:#132a30;
  --brick:#e0897a; --brick-soft:#33201c;
  --line:#2b332d; --shadow:rgba(0,0,0,0.4);
  --focus:#5fb39f;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth; scroll-padding-top: env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Karla",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
h1,h2,h3,.slab{font-family:"Zilla Slab",Georgia,"Times New Roman",serif;}
a{color:var(--andaman);}
button{font-family:inherit;}

/* ---------- Layout shell ---------- */
.shell{display:flex; min-height:100vh;}
.route-nav{
  width:236px; flex-shrink:0; background:var(--canopy-deep); color:#fff;
  padding:22px 0 18px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.route-nav .brand{padding:0 20px 16px; border-bottom:1px solid rgba(255,255,255,0.15); margin-bottom:8px;}
.route-nav .brand .k{font-size:11px; letter-spacing:.3px; color:#cfe6df; margin:0 0 3px;}
.route-nav .brand h1{font-size:19px; margin:0; line-height:1.25; color:#fff;}
.route-nav .brand .r{font-size:11.5px; color:#bcdcd2; margin-top:6px; line-height:1.5;}

.stations{position:relative; padding:14px 0 4px;}
.stations::before{
  content:""; position:absolute; left:29px; top:6px; bottom:6px; width:2px;
  background:rgba(255,255,255,0.22);
}
.station{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  background:none; border:none; color:#dcece6; cursor:pointer;
  padding:8px 20px; position:relative; font-size:13.5px; line-height:1.3;
}
.station .dot{
  width:11px; height:11px; border-radius:50%; background:var(--canopy-deep);
  border:2px solid #a9d3c7; flex-shrink:0; position:relative; z-index:1;
}
.station.active .dot{background:var(--saffron); border-color:var(--saffron);}
.station.active{color:#fff; font-weight:600;}
.station:hover{color:#fff;}
.station .n{opacity:.75; font-variant-numeric: tabular-nums; font-size:12px; width:16px; flex-shrink:0;}
.station.done .dot{background:#7fd0c6; border-color:#7fd0c6;}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  display:none; position:sticky; top:0; z-index:20; background:var(--paper);
  border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top,0px);
}
.topbar-inner{display:flex; overflow-x:auto; gap:4px; padding:10px 12px; -webkit-overflow-scrolling:touch;}
.topbar-inner::-webkit-scrollbar{display:none;}
.pill{
  flex-shrink:0; border:1px solid var(--line); background:var(--raised); color:var(--ink-soft);
  border-radius:999px; padding:6px 13px; font-size:12.5px; cursor:pointer; white-space:nowrap;
}
.pill.active{background:var(--canopy); color:#fff; border-color:var(--canopy);}

.content{flex:1; padding:38px 28px 120px; max-width:760px; width:100%; margin:0 auto;}
.panel{display:none;}
.panel.active{display:block; animation:fade .28s ease;}
@keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}
@media (prefers-reduced-motion: reduce){.panel.active{animation:none;}}

/* ---------- Overview / hero ---------- */
.hero-route{margin-bottom:6px;}
.hero-route svg{width:100%; height:auto; display:block;}
.hero-route .city{font-size:12px; fill:var(--ink-soft); font-family:"Karla",sans-serif;}
.hero-route .dateline{font-size:10.5px; fill:var(--ink-soft); font-family:"Karla",sans-serif;}
.hero-route .node{fill:var(--saffron);}
.hero-route .track{stroke:var(--line); stroke-width:2; fill:none;}
.hero-route .track-draw{stroke:var(--canopy); stroke-width:2; fill:none; stroke-dasharray:900; stroke-dashoffset:900; animation:draw 1.6s ease forwards .2s;}
@media (prefers-reduced-motion: reduce){.hero-route .track-draw{animation:none; stroke-dashoffset:0;}}
@keyframes draw{to{stroke-dashoffset:0;}}

h2.page-title{font-size:27px; margin:0 0 4px; color:var(--canopy-deep);}
:root[data-theme="dark"] h2.page-title{color:var(--canopy);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) h2.page-title{color:var(--canopy);}}
.page-sub{color:var(--ink-soft); font-size:14px; margin:0 0 22px;}

.tags{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:26px;}
.tag{border:1px solid var(--line); color:var(--ink-soft); background:var(--raised); padding:4px 11px; border-radius:999px; font-size:12px;}

table.dat{width:100%; border-collapse:collapse; margin-bottom:22px; font-size:13.5px;}
table.dat th{
  text-align:left; background:var(--canopy); color:#fff; padding:8px 10px; font-weight:600; font-size:12.5px;
}
table.dat td{padding:8px 10px; border-bottom:1px solid var(--line);}
table.dat tr:nth-child(even) td{background:var(--raised);}

h3.sec{font-size:15.5px; color:var(--canopy-deep); margin:26px 0 10px;}
:root[data-theme="dark"] h3.sec{color:var(--canopy);}
ul.plain{margin:0 0 4px; padding-left:20px;}
ul.plain li{margin-bottom:7px; line-height:1.55; font-size:14px;}

.callout{border:1px solid var(--line); border-radius:4px; padding:12px 14px; margin:14px 0; font-size:13.5px; line-height:1.55;}
.callout b.lbl{display:block; margin-bottom:3px; font-weight:700;}
.callout.food{background:var(--saffron-soft); border-color:var(--saffron);}
.callout.food b.lbl{color:var(--saffron);}
.callout.area{background:var(--andaman-soft); border-color:var(--andaman);}
.callout.area b.lbl{color:var(--andaman);}
.callout.warn{background:var(--brick-soft); border-color:var(--brick);}
.callout.warn b.lbl{color:var(--brick);}

/* ---------- Day panels ---------- */
.day-head{margin-bottom:6px;}
.day-kicker{font-size:12.5px; color:var(--saffron); font-weight:700; margin:0 0 2px;}
.day-head h2{font-size:25px; margin:0 0 3px; color:var(--canopy-deep);}
:root[data-theme="dark"] .day-head h2{color:var(--canopy);}
.day-head .sub{color:var(--ink-soft); font-size:13.5px; margin:0 0 16px;}

.progress-row{display:flex; align-items:center; gap:10px; margin-bottom:18px;}
.progress-track{flex:1; height:5px; background:var(--line); border-radius:3px; overflow:hidden;}
.progress-fill{height:100%; background:var(--canopy); width:0%; transition:width .25s ease;}
.progress-label{font-size:11.5px; color:var(--ink-soft); white-space:nowrap;}

.block{margin-bottom:20px;}
.block .time{
  font-weight:700; font-size:13.5px; color:var(--canopy-deep); margin-bottom:8px;
  padding-left:12px; border-left:3px solid var(--saffron);
}
:root[data-theme="dark"] .block .time{color:var(--canopy);}
.item{display:flex; align-items:flex-start; gap:9px; margin-bottom:8px; padding-left:12px;}
.item input[type=checkbox]{
  margin-top:3px; width:15px; height:15px; accent-color:var(--canopy); flex-shrink:0; cursor:pointer;
}
.item label{font-size:14px; line-height:1.55; cursor:pointer;}
.item.checked label{color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--line);}
.alt-line{font-size:12.8px; color:var(--ink-soft); font-style:italic; padding-left:33px; margin:-3px 0 9px; line-height:1.5;}

.reset-day{border:none; background:none; color:var(--ink-soft); font-size:12px; text-decoration:underline; cursor:pointer; padding:0; margin-top:6px;}

/* ---------- Extras / Food ---------- */
.extra-card{border:1px solid var(--line); border-radius:4px; padding:13px 15px; margin-bottom:12px; background:var(--raised);}
.extra-card h4{margin:0 0 5px; font-size:14.5px; color:var(--canopy-deep);}
:root[data-theme="dark"] .extra-card h4{color:var(--canopy);}
.extra-card p{margin:0; font-size:13.5px; line-height:1.55; color:var(--ink);}

.food-city{font-size:16px; margin:22px 0 10px; color:var(--canopy-deep);}
:root[data-theme="dark"] .food-city{color:var(--canopy);}
.food-item{margin-bottom:9px; font-size:13.8px; line-height:1.55;}
.food-item b{display:block;}

/* ---------- Bottom sequential nav ---------- */
.seqnav{
  position:sticky; bottom:0; background:var(--raised); border-top:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
  max-width:760px; margin:0 auto; width:100%;
}
.seqbtn{
  display:flex; flex-direction:column; border:none; background:none; cursor:pointer;
  color:var(--ink); padding:4px 8px; max-width:46%; text-align:left;
}
.seqbtn.next{text-align:right; align-items:flex-end;}
.seqbtn .k{font-size:10.5px; color:var(--ink-soft);}
.seqbtn .v{font-size:13.5px; font-weight:700; color:var(--canopy-deep);}
:root[data-theme="dark"] .seqbtn .v{color:var(--canopy);}
.seqbtn:disabled{opacity:0; pointer-events:none;}
.seqdot{font-size:11.5px; color:var(--ink-soft); flex-shrink:0;}

/* ---------- Mobile ---------- */
@media (max-width: 860px){
  .route-nav{display:none;}
  .topbar{display:block;}
  .content{padding:22px 16px 110px;}
}
</style>
</head>
<body>

<div class="shell">
  <nav class="route-nav" id="routeNav" aria-label="Trip sections">
    <div class="brand">
      <p class="k">MALAYSIA TRIP</p>
      <h1>22&ndash;29 Sep 2026</h1>
      <p class="r">Delhi &rarr; KL &rarr; Penang &rarr; Langkawi &rarr; KL &rarr; Delhi</p>
    </div>
    <div class="stations" id="stationsDesktop"></div>
  </nav>

  <div class="main">
    <div class="topbar"><div class="topbar-inner" id="pillsMobile"></div></div>
    <div class="content" id="content"></div>
    <div class="seqnav">
      <button class="seqbtn prev" id="prevBtn"><span class="k">Back</span><span class="v" id="prevLabel"></span></button>
      <span class="seqdot" id="seqPos"></span>
      <button class="seqbtn next" id="nextBtn"><span class="k">Next</span><span class="v" id="nextLabel"></span></button>
    </div>
  </div>
</div>

<script>
/* =================== DATA =================== */
const PANELS = [
{id:"overview", kind:"overview", nav:"Overview"},
{id:"practical", kind:"practical", nav:"Before you go"},
{id:"day1", kind:"day", nav:"Day 1 \u00b7 KL", num:1, title:"Kuala Lumpur", dateLabel:"Tue, 22 Sep", sub:"Landing day. Batu Caves in the morning, Brickfields and Thean Hou after, KLCC and Bukit Bintang at night.",
  area:"Three moves: Brickfields (breakfast, south) is on your way in from the airport train, so do it first. Then Batu Caves (north) and back down to Brickfields again for lunch and Thean Hou, since both are worth the detour. Evening stays central at KLCC and Bukit Bintang.",
  blocks:[
    {time:"6:00 AM to 7:30 AM &nbsp;\u00b7&nbsp; Touchdown", items:[
      "Land KLIA Terminal 1. Immigration and baggage claim, roughly 45 minutes.",
      "Exchange or withdraw some Ringgit at the arrivals hall before you head out, you'll want cash for today.",
      "KLIA Ekspres train to KL Sentral, about 28 to 30 minutes. Trains run from early morning."
    ]},
    {time:"7:30 AM to 8:15 AM &nbsp;\u00b7&nbsp; Breakfast, Brickfields", items:[
      "Brickfields (Little India) is a 5 minute walk from KL Sentral. Pick any of the busy South Indian breakfast stalls along Jalan Tun Sambanthan for dosa, idli or vada. Cheap, quick, and they open early for the working crowd."
    ]},
    {time:"8:30 AM to 9:00 AM &nbsp;\u00b7&nbsp; Drop your bags", items:[
      "Grab to citizenM Bukit Bintang, about 15 minutes.",
      "The room won't be ready till 2 to 3 PM. Leave your luggage with the front desk, they hold it for free, and freshen up in the lobby restroom."
    ]},
    {time:"9:15 AM to 12:30 PM &nbsp;\u00b7&nbsp; Batu Caves", items:[
      "Grab or KTM Komuter to Batu Caves, 35 to 45 minutes depending on traffic.",
      "<b>Batu Caves and the Lord Murugan statue.</b> Free entry, 272 painted steps. Cover shoulders and knees, sarongs available at the entrance if you need one. Keep your bag zipped and away from the macaques.",
      "<b>Dark Cave</b>, partway down the steps, easy to miss on purpose since most people do. A guided 45 minute eco-tour through an unlit conservation cave, bats, cave crickets, the rare Batu Caves trapdoor spider, and a stretch where every torch goes dark. Reviewers rate it above the main cave. Around RM35, hard hat and torch included, groups only, no booking needed but worth checking it's running that day."
    ]},
    {time:"1:00 PM to 3:30 PM &nbsp;\u00b7&nbsp; Back to Brickfields", items:[
      "Grab back down, about 35 to 40 minutes.",
      "<b>Lunch at Annalakshmi.</b> Pure vegetarian South Indian, pay-as-you-feel: you eat, then decide what it was worth. A KL institution, and a proper meal rather than a stopgap. Closed Mondays.",
      "<b>Thean Hou Temple</b>, about 10 minutes away. Six-tier Chinese temple on a hill, free entry, red lanterns, real skyline views, and usually uncrowded."
    ], alt:["Alt lunch: Vege Chat, Brickfields. Punjabi, pure veg, no egg, a more ordinary sit-down meal."]},
    {time:"4:00 PM to 5:00 PM &nbsp;\u00b7&nbsp; Check in properly", items:[
      "Grab back to citizenM, about 20 minutes. Your room should be ready now. Rest for an hour, you've been up since a red-eye flight."
    ]},
    {time:"5:30 PM to 7:00 PM &nbsp;\u00b7&nbsp; KLCC", items:[
      "<b>Petronas Twin Towers and KLCC Park.</b> Walk the park at golden hour. The Lake Symphony fountain show runs after dark, and the towers light up. Best photo angle is from the lake side of the park."
    ]},
    {time:"7:15 PM onward &nbsp;\u00b7&nbsp; Jalan Alor and dinner", items:[
      "Walk or one Grab back to Bukit Bintang, about 10 minutes.",
      "<b>Jalan Alor food street</b>, a short walk from the hotel. Mostly meat and seafood, so treat it as an atmosphere walk plus snacks: grilled corn, cut fruit, coconut water.",
      "<b>Dinner: Blue Boy Vegetarian Food Centre</b>, Jalan Tong Shin, a few minutes from Jalan Alor. Fully vegetarian hawker centre, so it's street food without the guesswork. Famous for its vegan char kway teow."
    ], alt:["Alt dinner: Simple Life Vegetarian, Bukit Bintang. Sit-down, air-conditioned, Malaysian vegetarian classics."]}
  ],
  headsUp:"You're on the move most of the day, roughly 2.5 hours of total Grab time. Annalakshmi is closed Mondays, fine since today is Tuesday. Do Jalan Alor before Blue Boy so you're not eating dinner too late."
},
{id:"day2", kind:"day", nav:"Day 2 \u00b7 KL", num:2, title:"Kuala Lumpur", dateLabel:"Wed, 23 Sep", sub:"One line west to east: colonial core, Chinatown, KL Tower, back to Bukit Bintang.",
  area:"A clean single sweep. Merdeka Square and Central Market are two minutes apart, Chinatown is next door, KL Tower is on the way back toward Bukit Bintang. Almost no backtracking today.",
  blocks:[
    {time:"9:30 AM to 12:30 PM &nbsp;\u00b7&nbsp; Old colonial core", items:[
      "Grab to Merdeka Square, about 15 minutes.",
      "<b>Merdeka Square.</b> The Sultan Abdul Samad Building with its copper domes is the backdrop. Best light in the morning, free.",
      "Walk to <b>Masjid Jamek</b> at the river confluence where KL was founded, and the <b>River of Life</b> waterfront beside it, five minutes on foot.",
      "<b>Central Market</b>, five minutes further. Art-deco heritage building, batik, crafts, a cool break from the sun.",
      "Petaling Street (Chinatown) is immediately next door."
    ]},
    {time:"12:45 PM to 2:00 PM &nbsp;\u00b7&nbsp; Lunch, Chinatown", items:[
      "<b>The Hungry Tapir.</b> Fully plant-based, set in a restored heritage shophouse, Western and fusion leaning. Two minutes from Central Market."
    ], alt:["Alt: Tian Yian. Taiwanese-style Buddhist vegetarian, noodles and rice bowls, no pungent roots."]},
    {time:"2:30 PM to 5:30 PM &nbsp;\u00b7&nbsp; KL Tower", items:[
      "<b>KL Tower Sky Deck.</b> The open-air glass Sky Box sits 300 metres up, inside the Bukit Nanas forest reserve, so the walk in is through actual rainforest in the middle of the city. Higher than the Petronas bridge and usually shorter queues.",
      "It sits between Chinatown and Bukit Bintang, so this is on your way back, not a detour.",
      "Optional: the free Bukit Nanas canopy walk at the base, about 30 minutes."
    ]},
    {time:"6:30 PM onward &nbsp;\u00b7&nbsp; Bukit Bintang", items:[
      "Free time, Pavilion KL and Berjaya Times Square are both a short walk from the hotel.",
      "<b>Dinner: Simple Life Vegetarian.</b> Malaysian classics done vegetarian, laksa, rendang, nasi lemak. Worth getting the local flavour profile safely at least once."
    ], alt:["Alt: Bombay Talkies, Brickfields. 100% vegetarian and vegan, Bollywood-themed, strong Jain menu. Closed Mondays."]}
  ],
  headsUp:"Pack tonight, not tomorrow morning. Day 3 is a travel day and a rushed checkout is how things get left behind."
},
{id:"day3", kind:"day", nav:"Day 3 \u00b7 KL\u2192Penang", num:3, title:"Kuala Lumpur \u2192 Penang", dateLabel:"Thu, 24 Sep", sub:"Fly 2:10 to 3:10 PM, then George Town's heritage core in one walking loop.",
  area:"The Penang evening is one tight cluster on foot: Cheah Kongsi, the street art, Chew Jetty and Chulia Street are all within about ten minutes of each other.",
  blocks:[
    {time:"Morning &nbsp;\u00b7&nbsp; Checkout and transfer", items:[
      "Keep it light, no new sightseeing. Check out of citizenM by 11 AM.",
      "Leave for the airport by about 11:30 AM, KLIA is roughly an hour from Bukit Bintang by Grab, or take the KLIA Ekspres from KL Sentral.",
      "Firefly moved its jet routes, including KL to Penang, from Subang to KLIA Terminal 1 in August 2025, so MH4741 should depart T1. Confirm on your e-ticket, since this changes the transfer entirely if it's wrong.",
      "Eat a proper lunch before boarding. KLIA T1 has food-court options landside with vegetable rice and noodle dishes, ask for no shrimp paste. There's no good food window again until evening otherwise."
    ]},
    {time:"3:10 PM to 4:30 PM &nbsp;\u00b7&nbsp; Arrive Penang", items:[
      "Land Penang International. Grab to George Town, 30 to 40 minutes.",
      "Check in at Le Dream Boutique Hotel.",
      "At check-in, confirm whether breakfast is actually included and running. Recent reviews flag it being dropped after a management change, worth asking rather than assuming."
    ]},
    {time:"4:45 PM to 7:00 PM &nbsp;\u00b7&nbsp; Heritage walking loop", items:[
      "<b>Cheah Kongsi</b>, Armenian Street, 5 minutes on foot. One of George Town's five great clan houses, restored to its 1873 form, noticeably quieter than Khoo Kongsi and pleasant for it. Around RM10, closes late afternoon, so go here first.",
      "<b>Penang street art</b>, same street. The famous 'Kids on a Bicycle' mural and the wrought-iron caricatures along Armenian Street and Lebuh Ah Quee. Late light is best for photos.",
      "<b>Chew Jetty</b>, 8 minutes on foot. A stilt-house village still lived in, with a boardwalk over the water. Go for sunset, and be mindful that people actually live here."
    ]},
    {time:"7:30 PM onward &nbsp;\u00b7&nbsp; Chulia Street dinner", items:[
      "<b>Chulia Street Night Hawker</b> (mostly along Carnarvon Street now, everyone still calls it Chulia Street), 10 minutes on foot from Chew Jetty.",
      "Vegetarian-safe: <b>popiah</b>, the fresh spring roll with yam bean, tofu and spring onion, about RM4 and the best cheap thing there, <b>apom</b> the sweet coconut pancake, and <b>muah chee</b>, warm glutinous rice in ground peanut.",
      "Skip the wantan mee, char kway teow, oyster omelette and lok lok. All meat, seafood or egg."
    ], alt:["Alt full dinner: Pinxin, fully vegan, does Malaysian classics properly. Book ahead, it's small."]}
  ],
  headsUp:"Carry cash tonight, hawker stalls don't take cards."
},
{id:"day4", kind:"day", nav:"Day 4 \u00b7 Penang", num:4, title:"Penang", dateLabel:"Fri, 25 Sep", sub:"Air Itam hills in the morning, George Town's heritage core after a fixed 3:30 PM mansion tour.",
  area:"Morning is the Air Itam cluster, Kek Lok Si and Penang Hill are ten minutes apart. Afternoon returns to central George Town, where the mansion and Khoo Kongsi are a short walk apart, but the mansion tour time is fixed, so today is built around that clock.",
  blocks:[
    {time:"8:30 AM to 10:30 AM &nbsp;\u00b7&nbsp; Kek Lok Si", items:[
      "Grab to Kek Lok Si, about 25 minutes. Go early, mornings are clearest before afternoon cloud builds.",
      "<b>Kek Lok Si Temple.</b> The largest Buddhist temple complex in Malaysia. Seven-storey Pagoda of Ten Thousand Buddhas, and an inclined lift to the 30 metre bronze Kuan Yin statue. Free to enter, small charges for the pagoda and lift."
    ]},
    {time:"10:45 AM to 11:45 AM &nbsp;\u00b7&nbsp; Lunch, on site", items:[
      "<b>Kek Lok Si Vegetarian Restaurant</b>, inside the temple complex on the lower level. Chinese vegetarian buffet and set meals, genuinely good, famous locally for its vegetarian roast duck. No extra travel needed, and a Buddhist temple kitchen is meat-free by definition, so it's one of the safest meals of the trip."
    ]},
    {time:"12:00 PM to 1:30 PM &nbsp;\u00b7&nbsp; Penang Hill", items:[
      "10 minutes from Kek Lok Si. The funicular climbs to 800 metres for island-wide views, noticeably cooler air at the top.",
      "At the summit: colonial-era bungalows, a mosque and Hindu temple, and The Habitat nature walk if you want another hour among the trees."
    ]},
    {time:"2:00 PM to 3:15 PM &nbsp;\u00b7&nbsp; Move to George Town", items:[

function practicalHTML(){

  <ul class="plain">
    <li>Visa-free entry for Indian passport holders, up to 30 days, policy runs through 31 December 2026.</li>

  <h3 class="sec">Money and connectivity</h3>
  <ul class="plain">

    <li>Get an eSIM before you fly (Airalo, Holafly) or a physical prepaid SIM at KLIA arrivals (Hotlink, Digi, Maxis counters). You'll want data working from the moment you land, for Grab and maps.</li>

function dayHTML(p){
  const doneKey = p.id;
  let html = `
  <p class="day-kicker">${p.dateLabel.toUpperCase()}</p>
  <div class="day-head"><h2>DAY ${p.num} &middot; ${p.title}</h2><p class="sub">${p.sub}</p></div>
  <div class="progress-row">
    <div class="progress-track"><div class="progress-fill" id="fill-${p.id}"></div></div>
    <span class="progress-label" id="label-${p.id}"></span>
  </div>
  <div class="callout area"><b class="lbl">Area plan</b>${p.area}</div>
  `;
  p.blocks.forEach((b, bi)=>{
    html += `<div class="block"><div class="time">${b.time}</div>`;
    b.items.forEach((it, ii)=>{
      const id = `${p.id}-${bi}-${ii}`;
      html += `<div class="item" data-id="${id}">
        <input type="checkbox" id="chk-${id}">
        <label for="chk-${id}">${it}</label>
      </div>`;
    });
    if(b.alt){ b.alt.forEach(a=> html += `<div class="alt-line">${a}</div>`); }
    html += `</div>`;
  });
  if(p.headsUp){
    html += `<div class="callout warn"><b class="lbl">Heads up</b>${p.headsUp}</div>`;
  }
  html += `<button class="reset-day" data-reset="${p.id}">Reset today's checklist</button>`;
  return html;
}

/* ---- checklist storage ---- */
function loadChecks(){
  try{ return JSON.parse(localStorage.getItem("mys_trip_checks")||"{}"); }catch(e){ return {}; }
}
function saveChecks(obj){
  try{ localStorage.setItem("mys_trip_checks", JSON.stringify(obj)); }catch(e){}
}
let CHECKS = loadChecks();

function updateProgress(p){
  if(p.kind!=="day") return;
  const total = p.blocks.reduce((s,b)=>s+b.items.length,0);
  let done = 0;
  p.blocks.forEach((b,bi)=>b.items.forEach((it,ii)=>{ if(CHECKS[`${p.id}-${bi}-${ii}`]) done++; }));
  const fill = document.getElementById(`fill-${p.id}`);
  const label = document.getElementById(`label-${p.id}`);
  if(fill) fill.style.width = total? (done/total*100)+"%":"0%";
  if(label) label.textContent = `${done} of ${total} done`;
}

function wireDay(p){
  if(p.kind!=="day") return;
  content.querySelectorAll(".item").forEach(el=>{
    const id = el.getAttribute("data-id");
    const box = el.querySelector("input");
    box.checked = !!CHECKS[id];
    if(box.checked) el.classList.add("checked");
    box.addEventListener("change", ()=>{
      CHECKS[id] = box.checked;
      saveChecks(CHECKS);
      el.classList.toggle("checked", box.checked);
      updateProgress(p);
      markStationDone();
    });
  });
  updateProgress(p);
  const resetBtn = content.querySelector(`[data-reset="${p.id}"]`);
  if(resetBtn){
    resetBtn.addEventListener("click", ()=>{
      p.blocks.forEach((b,bi)=>b.items.forEach((it,ii)=>{ delete CHECKS[`${p.id}-${bi}-${ii}`]; }));
      saveChecks(CHECKS);
      renderCurrent();
    });
  }
}

function dayProgressFraction(p){
  if(p.kind!=="day") return null;
  const total = p.blocks.reduce((s,b)=>s+b.items.length,0);
  let done = 0;
  p.blocks.forEach((b,bi)=>b.items.forEach((it,ii)=>{ if(CHECKS[`${p.id}-${bi}-${ii}`]) done++; }));
  return total? done/total : 0;
}

function markStationDone(){
  PANELS.forEach((p,i)=>{
    if(p.kind==="day"){
      const frac = dayProgressFraction(p);
      const els = document.querySelectorAll(`.station[data-idx="${i}"], .pill[data-idx="${i}"]`);
      els.forEach(el=> el.classList.toggle("done", frac>=1));
    }
  });
}

/* ---- nav build ---- */
function buildNav(){
  stationsDesktop.innerHTML = PANELS.map((p,i)=>`
    <button class="station" data-idx="${i}"><span class="dot"></span>${p.nav}</button>
  `).join("");
  pillsMobile.innerHTML = PANELS.map((p,i)=>`
    <button class="pill" data-idx="${i}">${p.nav}</button>
  `).join("");
  document.querySelectorAll(".station, .pill").forEach(btn=>{
    btn.addEventListener("click", ()=> goTo(parseInt(btn.getAttribute("data-idx"),10)));
  });
}

function goTo(i){
  current = Math.max(0, Math.min(PANELS.length-1, i));
  renderCurrent();
  try{ localStorage.setItem("mys_trip_last", String(current)); }catch(e){}
  content.scrollTop = 0;
  window.scrollTo(0,0);
}

function renderCurrent(){
  const p = PANELS[current];
  content.innerHTML = `<div class="panel active">${renderPanel(p)}</div>`;
  wireDay(p);
  document.querySelectorAll(".station").forEach(el=> el.classList.toggle("active", parseInt(el.getAttribute("data-idx"),10)===current));
  document.querySelectorAll(".pill").forEach(el=> el.classList.toggle("active", parseInt(el.getAttribute("data-idx"),10)===current));
  const activePill = document.querySelector(".pill.active");
  if(activePill) activePill.scrollIntoView({inline:"center", block:"nearest"});
  markStationDone();

  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const prevLabel = document.getElementById("prevLabel");
  const nextLabel = document.getElementById("nextLabel");
  const seqPos = document.getElementById("seqPos");
  if(current<=0){ prevBtn.disabled = true; } else { prevBtn.disabled = false; prevLabel.textContent = PANELS[current-1].nav; }
  if(current>=PANELS.length-1){ nextBtn.disabled = true; } else { nextBtn.disabled = false; nextLabel.textContent = PANELS[current+1].nav; }
  seqPos.textContent = `${current+1} / ${PANELS.length}`;
}

document.getElementById("prevBtn").addEventListener("click", ()=> goTo(current-1));
document.getElementById("nextBtn").addEventListener("click", ()=> goTo(current+1));

buildNav();
let start = 0;
try{ const last = parseInt(localStorage.getItem("mys_trip_last"),10); if(!isNaN(last) && last>=0 && last<PANELS.length) start = last; }catch(e){}
goTo(start);
</script>
</body>
</html>
